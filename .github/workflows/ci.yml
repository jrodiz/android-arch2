name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs of the same workflow on the same branch — saves
# minutes when a PR is rebased / force-pushed mid-build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android · ktlint + unit tests + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        # Caches the Gradle dependency cache + the configuration cache, dramatically
        # speeding up subsequent runs on the same branch.
        uses: gradle/actions/setup-gradle@v3

      # Style check first — cheap, fails fast, and a failure is usually an
      # IDE save with the wrong settings rather than a broken build. Run
      # `./gradlew ktlintFormat` locally to auto-fix.
      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace

      # Run all module unit tests. AndroidFeatureConventionPlugin now wires
      # useJUnitPlatform() so :feature:*:presentation tests actually execute
      # (silently reported "0 executed" before — see commit e87f781).
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # Always upload test reports so a contributor can diff their local run
      # against the CI run; on success they're handy for "did my test really
      # execute?" checks, on failure they're the source of truth.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 14
          if-no-files-found: warn

  functions:
    name: Cloud Functions · tsc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check + build
        run: npm run build
